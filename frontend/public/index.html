<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ELTA Магазин</title>
<link rel="preload" as="image" href="images/brand/logo-E.png">
<link rel="preload" as="image" href="images/brand/logo-L.png">
<link rel="preload" as="image" href="images/brand/logo-T.png">
<link rel="preload" as="image" href="images/brand/logo-A.png">
<link rel="preload" as="image" href="images/brand/logo-tagline.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles/globals.css?v=4">
</head>
<body>

<div id="intro" aria-hidden="true">
  <div class="intro-bg"></div>
  <div class="intro-glow"></div>
  <div class="intro-sweep"></div>
  <div class="intro-c">
    <div class="intro-word">
      <div class="intro-halo"></div>
      <img src="images/brand/logo-E.png" alt=""><img src="images/brand/logo-L.png" alt=""><img src="images/brand/logo-T.png" alt=""><img src="images/brand/logo-A.png" alt="">
    </div>
    <div class="intro-sub">
      <div class="intro-line"></div>
      <img class="intro-tag" src="images/brand/logo-tagline.png" alt="Ready for anything">
    </div>
  </div>
</div>
<script src="src/components/features/IntroGate.js"></script>

<header class="topbar" id="topbar">
  <div class="logo"><img src="images/brand/logo-elta.png" alt="ELTA" width="90" height="21"></div>
  <div class="search" id="searchBox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Поиск" aria-label="Поиск товаров" autocomplete="off" enterkeyhint="search">
    <button class="clear" id="qClear" aria-label="Очистить поиск">✕</button>
  </div>
  <button class="cart-btn" id="cartBtn" aria-label="Корзина">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3h2.2l2.4 11.2a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.2L21 7H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg>
    <span class="badge" id="badge">0</span>
  </button>
</header>

<main>
  <!-- категории кругами сразу под шапкой: касание открывает раздел в каталоге -->
  <div class="wrap cats-wrap"><div class="tiles" id="tiles"></div></div>

  <div class="wrap" id="catalog">
    <div class="section-head"><h2><span id="secTitle">Все товары</span><i id="shown"></i></h2>
      <div class="brand-wrap"><button class="brand-btn" id="brandBtn">Бренд ▾</button><div class="brand-menu" id="brandMenu"></div></div></div>
    <div class="grid" id="grid">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </div>
  <footer class="foot" id="foot"></footer>
</main>

<section class="page" id="page"></section>
<div class="mainbar" id="mainbar"><button id="mainbarBtn"></button></div>
<div class="toast" id="toast"></div>
<nav class="tabbar" id="tabbar">
  <button class="on" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg><span></span></button>
  <button data-tab="cats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg><span></span></button>
  <button data-tab="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3h2.2l2.4 11.2a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.2L21 7H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg><i id="tabBadge"></i><span></span></button>
  <button data-tab="manager"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4V5Z"/></svg><span></span></button>
</nav>
<div class="sheet" id="sheet"><div class="sheet-bg" data-sheet-close></div><div class="sheet-in" id="sheetIn"></div></div>


<script src="src/hooks/useTelegram.js?v=4"></script>
<script src="src/lib/utils.js?v=4"></script>
<script src="src/lib/i18n.js?v=4"></script>
<script src="src/providers/TelegramProvider.js?v=4"></script>
<script src="src/store/appStore.js?v=4"></script>
<script src="src/store/cartStore.js?v=4"></script>
<script src="src/store/favStore.js?v=4"></script>
<script src="src/lib/api.js?v=4"></script>
<script src="src/lib/introSound.js?v=4"></script>
<script src="src/components/features/Intro.js?v=4"></script>
<script src="src/components/ui/MainButton.js?v=4"></script>
<script src="src/components/ui/Toast.js?v=4"></script>
<script src="src/components/layout/Header.js?v=4"></script>
<script src="src/components/layout/BottomNavigation.js?v=4"></script>
<script src="src/components/layout/Footer.js?v=4"></script>
<script src="src/components/features/ProductCard.js?v=4"></script>
<script src="src/components/features/Catalog.js?v=4"></script>
<script src="src/components/features/CategoryTiles.js?v=4"></script>
<script src="src/components/features/BrandMenu.js?v=4"></script>
<script src="src/components/features/ProductPage.js?v=4"></script>
<script src="src/components/features/CartList.js?v=4"></script>
<script src="src/components/features/CheckoutForm.js?v=4"></script>
<script src="src/components/features/OrderDone.js?v=4"></script>
<script src="src/app/navigation.js?v=4"></script>
<script src="src/app/page.js?v=4"></script>
</body>
</html>
